
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Default application page">
  <title>Welcome | GatewayAPI default endpoint</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system,
                   BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #0b1220;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      padding: 24px clamp(20px, 5vw, 80px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: -.3px;
    }

    .logo {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #2563eb;
      font-size: 22px;
    }

    .status {
      color: #6ee7b7;
      background: #064e3b55;
      border: 1px solid #065f46;
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 50px 20px;
      background:
        radial-gradient(ellipse at 50% 45%,
          #1e3a8a55 0%, transparent 60%);
    }

    .content {
      text-align: center;
      max-width: 680px;
      animation: appear .7s ease-out both;
    }

    .icon {
      display: grid;
      place-items: center;
      margin: 0 auto 30px;
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      box-shadow: 0 15px 55px #2563eb55;
      font-size: 42px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 66px);
      letter-spacing: -2px;
      margin: 0 0 20px;
    }

    .lead {
      font-size: clamp(17px, 3vw, 22px);
      color: #cbd5e1;
      line-height: 1.6;
      margin: 0 0 16px;
    }

    .description {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.8;
      margin: 0 auto;
      max-width: 520px;
    }

    .indicator {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding: 12px 20px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #1e293b88;
      color: #cbd5e1;
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 12px #34d39999;
    }

    footer {
      border-top: 1px solid #1e293b;
      color: #64748b;
      text-align: center;
      font-size: 13px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .content { animation: none; }
    }

    @media (max-width: 480px) {
      header { padding: 20px; }
      .brand { font-size: 13px; }
      .status { font-size: 11px; padding: 7px 10px; }
      h1 { letter-spacing: -1px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">⬡</div>
      <span> Default Endpoint</span>
    </div>
    
  </header>

  <main>
    <section class="content">
      <div class="icon" aria-hidden="true">▣</div>
      <h1>Welcome!</h1>
      <p class="lead">
        You have reached the GatewayAPI default endpoint page
      </p>      
      <div class="indicator">
        <span class="dot" aria-hidden="true"></span>
        Server operational
      </div>
    </section>
  </main>

  <footer>
    Powered by Fernando Sainovich &bull; Running on containers
  </footer>
</body>
</html>
